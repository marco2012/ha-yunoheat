name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ruff
        # Pinned deliberately: an unpinned `pip install ruff` picks up whatever
        # released last, so a new default rule set turns CI red without a commit.
        run: pip install ruff==0.16.0
      - name: Run Ruff
        run: ruff check .
